<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-Do-List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css"
  </head>
  <body> 
    <nav class="navbar navbar-expand bg-primary px-4 py-2">
      <div class="container">
        <a class="navbar-brand text-white fw-bold" href="#">My To-Do-List</a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
    </nav>

    <div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 800px;">

        <h2 class="text-center">Task Manager</h2>
        <p class="text-center text-muted">
            Organize your tasks and stay productive.
        </p>

        <div class="input-group my-4">
            <input type="text" id="taskInput"
                   class="form-control"
                   placeholder="Enter a new task...">

            <button class="btn btn-primary" id="addBtn">
                Add Task
            </button>
        </div>

        <div class="d-flex justify-content-between mb-3">
            <span>Your tasks</span>
            <span class="badge bg-primary" id="taskCounter">
                0 remaining
            </span>
        </div>

        <div class="btn-group w-100 mb-4">
            <button class="btn btn-primary filter-btn"
                    data-filter="all">All</button>

            <button class="btn btn-outline-primary filter-btn"
                    data-filter="active">Active</button>

            <button class="btn btn-outline-primary filter-btn"
                    data-filter="completed">Completed</button>
        </div>

        <ul id="taskList" class="list-group mb-3">
        </ul>

        <p id="emptyMessage" class="text-center text-muted mt-3">
            No tasks yet. Add your first task!
        </p>

        <div class="text-end">
            <button class="btn btn-outline-danger" id="clearBtn">
                Clear Completed
            </button>
        </div>

        <p id="errorMessage" class="text-danger mt-2"></p>

    </div>
</div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
